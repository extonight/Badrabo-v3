<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" 
   content="width=device-width, initial-scale=1.0">
 <title>
  Badra
 </title>
    <link rel="stylesheet" 
        href="style/index.css"
        >
    <link rel="stylesheet" 
        href="style/header.css"
        >
    <link rel="stylesheet" 
        href="style/sidebar.css"
        >
    <link rel="stylesheet" 
        href="style/footer.css"
        >
    <link rel="stylesheet" 
        href="style/general.css"
        >
      <link rel="preconnect" 
        href="https://fonts.googleapis.com"
        >
      <link rel="preconnect" 
        href="https://fonts.gstatic.com" crossorigin
        >
      <link href="https://fonts.googleapis.com/
        css2?family=Archivo+Black&family=Roboto:ital,wght@0,

        rel="stylesheet"
        >
      <script src="js/main.js" defer></script>
</head>
<body>
 <a href="#main" class="skip-link">Hoppa till innehåll</a>
    <header class="header">
      <div class="left-section">
      <label for="menu-checkbox" class="menu-label" aria-label="Meny">
        <img class="menu" src="ICONS/hamburger-menu.svg" 
      alt="Meny ikon" loading="lazy">
      </label>
      <h1>
        <a href="index.html">
       <img class="logo" src="img/Badrabooo.svg" 
       alt="Badralogo" loading="lazy">
       </a>
      </h1>
     </div>
    
     
      <nav>
      <div class="right-section">
       <div class="sök-container">
        <input id="search" class="sök" 
        type="text" name="q" 
        placeholder="Sök bostäder, områden, adresser…">
        <button class="search-button" type="button">
        <img class="sökikon" src="ICONS/searchg.svg" alt="" loading="lazy">
        </button>
        </div>
        <div class="logga-in-container">
          <a class="logga-in" href="inlogg.html" 
             target="_blank" rel="noopener noreferrer">
            <img class="lock" src="ICONS/lock.svg" 
            alt="Logga in ikon">
            <span class="logga-in-text"> Logga in </span>
          </a>
        </div>
       </div>
      </nav>
    </header>
    <input type="checkbox" id="menu-checkbox" 
      class="menu-checkbox" aria-hidden="true">
    <aside>
      <nav>
        <div class="sidebar">
          <ul class="sidebar-list">
          <li><a class="sidebar-link" href="index.html">
            <img class="sidebar-icon" 
            src="ICONS/home.svg" alt="Hem ikon">
            Hem
          </a></li>
          <li><a class="sidebar-link" href="utforska.html">
            <img class="sidebar-icon" 
            src="ICONS/searchg.svg" alt="Sök ikon">
            Om oss
          </a></li>
          <li><a class="sidebar-link" href="inlogg.html">
            <img class="sidebar-icon" 
            src="ICONS/profileg.svg" alt="Mina sidor ikon">
            Mina sidor
          </a></li>
          </ul>
        </div>
      </nav>
    </aside>
    <main id="main" class="main">
      <h2 class="section-title">
        Utforska bostäder
      </h2>
      <p id="uiMessage" class="ui-message" role="status" aria-live="polite"></p>
      <section id="listingGrid" class="bostads-grid" aria-live="polite">
          <!--Listan skapas av Javasript-->
      </section>
    </main>
    <footer>
        <div class="footer">
      <section class="Badrabo-logo">
        <img src="img/Badrabooo.svg" alt="Badrabo logo">
        <p>Badrabo - jämför och välj den perfekta bostaden</p>
      </section>
      <nav class="footer-länkar">
        <ul>
          <li>
           <a class="footer-länk" href="index.html">
            Hem
           </a>
          </li>
          <li><a class="footer-länk" href="utforska.html">
            Om oss
          </a></li>
          <li><a class="footer-länk" href="inlogg.html">
            Mina sidor
          </a></li>
        </ul>
      </nav>
      <section class="kontakt">
        <h3 class="footer-kontakt">Kontakt</h3>
        <p>E-post: <a href="mailto:support@badrabo.se" 
          class="footer-kontakt-link">support@badrabo.se</a>
        </p>
        <p>Hellogatan 12, 111 11 Stockholm</p>
      </section>
      </div>
      <section class="botten-footer">
        <p>&#169; 2025 Badrabo. All rights reserved</p> 
      </section>
     </footer>
